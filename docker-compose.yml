services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: secureshare
      POSTGRES_USER: secureshare
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureshare -d secureshare"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: secureshare_dev
      MINIO_ROOT_PASSWORD: local_dev_only_change_me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >
      until mc alias set local http://minio:9000 secureshare_dev local_dev_only_change_me; do sleep 1; done;
      mc mb --ignore-existing local/secureshare-files;
      mc anonymous set none local/secureshare-files;

volumes:
  postgres-data:
  minio-data: